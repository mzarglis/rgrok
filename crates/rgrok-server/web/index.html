<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>rgrok — Inspection UI</title>
<style>
  :root {
    --bg: #0f1117; --surface: #1a1d27; --border: #2a2d3a;
    --text: #e1e4ed; --muted: #8b8fa3; --accent: #6c7aff;
    --green: #4caf50; --red: #f44336; --yellow: #ffc107; --blue: #2196f3;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
    background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
  header { background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 16px; font-weight: 600; }
  header h1 span { color: var(--accent); }
  .toolbar { display: flex; gap: 8px; align-items: center; }
  .toolbar input { background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 6px 10px; border-radius: 4px; font-size: 13px; width: 240px; }
  .btn { background: var(--surface); border: 1px solid var(--border); color: var(--text);
    padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; }
  .btn:hover { border-color: var(--accent); }
  .btn-danger { color: var(--red); }
  .status-bar { background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 8px 20px; font-size: 12px; color: var(--muted); display: flex; gap: 24px; }
  .status-bar .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green);
    display: inline-block; margin-right: 6px; }
  main { flex: 1; display: flex; overflow: hidden; }
  .request-list { width: 400px; border-right: 1px solid var(--border); overflow-y: auto; }
  .request-item { padding: 10px 16px; border-bottom: 1px solid var(--border); cursor: pointer;
    display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .request-item:hover, .request-item.active { background: var(--surface); }
  .method { font-weight: 700; font-size: 11px; padding: 2px 6px; border-radius: 3px;
    min-width: 44px; text-align: center; }
  .method-GET { background: rgba(76,175,80,0.15); color: var(--green); }
  .method-POST { background: rgba(33,150,243,0.15); color: var(--blue); }
  .method-PUT { background: rgba(255,193,7,0.15); color: var(--yellow); }
  .method-DELETE { background: rgba(244,67,54,0.15); color: var(--red); }
  .method-PATCH { background: rgba(108,122,255,0.15); color: var(--accent); }
  .req-path { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .req-status { font-size: 12px; font-weight: 600; }
  .req-status.s2xx { color: var(--green); }
  .req-status.s3xx { color: var(--blue); }
  .req-status.s4xx { color: var(--yellow); }
  .req-status.s5xx { color: var(--red); }
  .req-duration { color: var(--muted); font-size: 11px; min-width: 40px; text-align: right; }
  .detail-pane { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .detail-empty { flex: 1; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 14px; }
  .tabs { display: flex; border-bottom: 1px solid var(--border); background: var(--surface); }
  .tab { padding: 10px 16px; font-size: 13px; cursor: pointer; color: var(--muted);
    border-bottom: 2px solid transparent; }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .tab-content { flex: 1; overflow-y: auto; padding: 16px; font-size: 13px; }
  .detail-header { display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--surface); }
  table.headers { width: 100%; border-collapse: collapse; }
  table.headers td { padding: 4px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  table.headers td:first-child { color: var(--accent); font-weight: 600; white-space: nowrap; width: 200px; }
  pre.body { background: var(--surface); padding: 12px; border-radius: 4px; overflow-x: auto;
    white-space: pre-wrap; word-break: break-all; }
  .empty-list { padding: 40px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1><span>rgrok</span> inspect</h1>
  <div class="toolbar">
    <input type="text" id="filter" placeholder="Filter by path, method, status...">
    <button class="btn btn-danger" id="clearButton" type="button">Clear</button>
  </div>
</header>
<div class="status-bar" id="statusBar">
  <span><span class="dot"></span>Connecting...</span>
</div>
<main>
  <div class="request-list" id="requestList">
    <div class="empty-list">Waiting for requests...</div>
  </div>
  <div class="detail-pane" id="detailPane">
    <div class="detail-empty">Select a request to inspect</div>
  </div>
</main>
<script>
const API = '';
let requests = [];
let selected = null;
let activeTab = 'headers';

function element(tag, className, value) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (value !== undefined && value !== null) node.textContent = String(value);
  return node;
}

function csrfToken() {
  const match = document.cookie.match(/(?:^|;\s*)rgrok_csrf=([^;]*)/);
  if (!match) return '';
  try { return decodeURIComponent(match[1]); } catch { return match[1]; }
}

function mutate(url, options) {
  const headers = Object.assign({}, options && options.headers, {'X-rgrok-CSRF': csrfToken()});
  return fetch(url, Object.assign({}, options, {headers}));
}

async function loadRequests() {
  try {
    const r = await fetch(API + '/api/requests');
    requests = await r.json();
    renderList();
  } catch(e) { console.error('Failed to load requests', e); }
}

async function loadStatus() {
  try {
    const r = await fetch(API + '/api/status');
    const s = await r.json();
    const bar = document.getElementById('statusBar');
    const connected = element('span');
    connected.append(element('span', 'dot'), document.createTextNode(s.domain || 'rgrok'));
    bar.replaceChildren(connected,
      element('span', '', 'Tunnels: ' + (s.active_tunnels || 0)),
      element('span', '', 'TCP: ' + (s.tcp_tunnels || 0)));
  } catch(e) {}
}

function connectSSE() {
  const es = new EventSource(API + '/api/stream');
  es.onmessage = (e) => {
    try {
      const ev = JSON.parse(e.data);
      if (ev.event === 'new_request') {
        requests.unshift(ev.request);
        renderList();
      } else if (ev.event === 'request_completed') {
        const req = requests.find(r => r.id === ev.id);
        if (req) {
          req.duration_ms = ev.duration_ms;
          req.resp_status = ev.resp_status;
          renderList();
          if (selected === req.id) renderDetail(req);
        }
      }
    } catch(err) {}
  };
  es.onerror = () => setTimeout(connectSSE, 3000);
}

function renderList() {
  const filter = (document.getElementById('filter').value || '').toLowerCase();
  const filtered = requests.filter(r => {
    if (!filter) return true;
    return (r.req_method + ' ' + r.req_url + ' ' + (r.resp_status || '')).toLowerCase().includes(filter);
  });
  const el = document.getElementById('requestList');
  el.replaceChildren();
  if (!filtered.length) { el.append(element('div', 'empty-list', 'No requests captured')); return; }
  filtered.forEach(r => {
    const item = element('div', 'request-item' + (selected === r.id ? ' active' : ''));
    item.addEventListener('click', () => selectReq(r.id));
    const method = element('span', 'method ' + methodClass(r.req_method), r.req_method);
    item.append(method,
      element('span', 'req-path', r.req_url),
      element('span', 'req-status ' + statusClass(r.resp_status), r.resp_status || ''),
      element('span', 'req-duration', r.duration_ms != null ? r.duration_ms + 'ms' : '...'));
    el.append(item);
  });
}

function methodClass(method) {
  return ['GET', 'POST', 'PUT', 'DELETE', 'PATCH'].includes(method) ? 'method-' + method : 'method';
}

function statusClass(s) {
  if (!s) return '';
  if (s < 300) return 's2xx';
  if (s < 400) return 's3xx';
  if (s < 500) return 's4xx';
  return 's5xx';
}

function selectReq(id) {
  selected = id;
  const req = requests.find(r => r.id === id);
  if (req) renderDetail(req);
  renderList();
}

function renderDetail(r) {
  const pane = document.getElementById('detailPane');
  pane.replaceChildren();
  const header = element('div', 'detail-header');
  const title = element('span');
  title.append(element('strong', '', r.req_method), document.createTextNode(' ' + (r.req_url || '')));
  const replayButton = element('button', 'btn', 'Replay');
  replayButton.type = 'button';
  replayButton.addEventListener('click', () => replay(r.id));
  header.append(title, replayButton);
  const tabs = element('div', 'tabs');
  [['headers', 'Headers'], ['reqbody', 'Request Body'], ['response', 'Response'], ['timing', 'Timing']]
    .forEach(([name, label]) => {
      const tab = element('div', 'tab' + (activeTab === name ? ' active' : ''), label);
      tab.addEventListener('click', () => setTab(name));
      tabs.append(tab);
    });
  const content = element('div', 'tab-content');
  content.append(tabContent(r));
  pane.append(header, tabs, content);
}

function setTab(t) { activeTab = t; const r = requests.find(x => x.id === selected); if(r) renderDetail(r); }

function tabContent(r) {
  if (activeTab === 'headers') {
    const wrapper = document.createDocumentFragment();
    wrapper.append(element('h4', '', 'Request Headers'));
    const table = element('table', 'headers');
    (r.req_headers || []).forEach(([k, v]) => appendHeaderRow(table, k, v));
    wrapper.append(table);
    if (r.resp_headers) {
      wrapper.append(element('h4', '', 'Response Headers'));
      const responseTable = element('table', 'headers');
      r.resp_headers.forEach(([k, v]) => appendHeaderRow(responseTable, k, v));
      wrapper.append(responseTable);
    }
    return wrapper;
  }
  if (activeTab === 'reqbody') {
    if (!r.req_body) return element('div', 'empty-list', 'No request body');
    return element('pre', 'body', decodeBody(r.req_body));
  }
  if (activeTab === 'response') {
    const wrapper = document.createDocumentFragment();
    const status = element('p');
    status.append(document.createTextNode(r.resp_status ? 'Status: ' : 'Awaiting response...'));
    if (r.resp_status) status.append(element('strong', '', r.resp_status));
    wrapper.append(status);
    if (r.resp_body) {
      wrapper.append(element('pre', 'body', decodeBody(r.resp_body)));
      if (r.resp_body_truncated) wrapper.append(element('p', '', 'Body truncated (>1MB)'));
    }
    return wrapper;
  }
  if (activeTab === 'timing') {
    const table = element('table', 'headers');
    appendHeaderRow(table, 'Captured at', r.captured_at || 'N/A');
    appendHeaderRow(table, 'Duration', r.duration_ms != null ? r.duration_ms + 'ms' : 'Pending');
    appendHeaderRow(table, 'Remote addr', r.remote_addr || 'N/A');
    appendHeaderRow(table, 'TLS version', r.tls_version || 'None');
    appendHeaderRow(table, 'Tunnel ID', r.tunnel_id || 'N/A');
    return table;
  }
  return document.createDocumentFragment();
}

function appendHeaderRow(table, key, value) {
  const row = document.createElement('tr');
  row.append(element('td', '', key), element('td', '', value));
  table.append(row);
}

function decodeBody(body) {
  try { return atob(body); } catch { return String(body); }
}

async function replay(id) {
  try {
    const r = await mutate(API + '/api/requests/' + encodeURIComponent(id) + '/replay', { method: 'POST' });
    if (r.ok) { const d = await r.json(); setTimeout(loadRequests, 500); }
  } catch(e) { console.error('Replay failed', e); }
}

async function clearAll() {
  await mutate(API + '/api/requests', { method: 'DELETE' });
  requests = []; selected = null; renderList();
  document.getElementById('detailPane').replaceChildren(element('div', 'detail-empty', 'Select a request to inspect'));
}

document.getElementById('filter').addEventListener('input', renderList);
document.getElementById('clearButton').addEventListener('click', clearAll);
loadRequests();
loadStatus();
connectSSE();
setInterval(loadStatus, 10000);
</script>
</body>
</html>
