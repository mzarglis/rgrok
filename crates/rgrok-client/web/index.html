<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>rgrok — Inspection UI</title>
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--border:#2a2d3a;--text:#e1e4ed;--muted:#8b8fa3;--accent:#6c7aff;--green:#4caf50;--red:#f44336}
*{box-sizing:border-box}body{margin:0;font:13px monospace;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}
header,.status-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:16px}header{justify-content:space-between}h1{margin:0;font-size:16px}h1 span{color:var(--accent)}
input{background:var(--bg);color:var(--text);border:1px solid var(--border);padding:6px;width:240px}button{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:6px 12px;cursor:pointer}.btn-danger{color:var(--red)}
.status-bar{color:var(--muted);font-size:12px}.dot{display:inline-block;width:8px;height:8px;margin-right:6px;border-radius:50%;background:var(--green)}
main{display:flex;flex:1;overflow:hidden}.request-list{width:400px;border-right:1px solid var(--border);overflow:auto}.request-item{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;gap:10px;cursor:pointer}.request-item:hover,.request-item.active{background:var(--surface)}
.method{min-width:44px;font-weight:bold}.req-path{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.req-duration{color:var(--muted)}.detail-pane{flex:1;display:flex;flex-direction:column;overflow:hidden}
.detail-header{padding:12px 16px;display:flex;justify-content:space-between;border-bottom:1px solid var(--border)}.tabs{display:flex;border-bottom:1px solid var(--border)}.tab{padding:10px 16px;color:var(--muted);cursor:pointer}.tab.active{color:var(--text);border-bottom:2px solid var(--accent)}
.tab-content{overflow:auto;padding:16px}table.headers{width:100%;border-collapse:collapse}td{padding:4px 8px;border-bottom:1px solid var(--border);vertical-align:top}td:first-child{color:var(--accent);font-weight:bold;width:200px}pre.body{background:var(--surface);padding:12px;white-space:pre-wrap;word-break:break-all}.empty-list,.detail-empty{padding:40px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<header><h1><span>rgrok</span> inspect</h1><div><input id="filter" type="text" placeholder="Filter by path, method, status..."><button id="clearButton" class="btn-danger" type="button">Clear</button></div></header>
<div class="status-bar" id="statusBar"><span><span class="dot"></span>Connecting...</span></div>
<main><div class="request-list" id="requestList"><div class="empty-list">Waiting for requests...</div></div><div class="detail-pane" id="detailPane"><div class="detail-empty">Select a request to inspect</div></div></main>
<script>
const API='';let requests=[];let selected=null;let activeTab='headers';
function element(tag,className,value){const node=document.createElement(tag);if(className)node.className=className;if(value!==undefined&&value!==null)node.textContent=String(value);return node}
function csrfToken(){const match=document.cookie.match(/(?:^|;\s*)rgrok_csrf=([^;]*)/);if(!match)return '';try{return decodeURIComponent(match[1])}catch(error){return match[1]}}
function mutate(url,options){const headers=Object.assign({},options&&options.headers,{'X-rgrok-CSRF':csrfToken()});return fetch(url,Object.assign({},options,{headers}))}
async function loadRequests(){try{const response=await fetch(API+'/api/requests');requests=await response.json();renderList()}catch(error){console.error('Failed to load requests',error)}}
async function loadStatus(){try{const response=await fetch(API+'/api/status');const status=await response.json();const bar=document.getElementById('statusBar');const connected=element('span');connected.append(element('span','dot'),document.createTextNode(status.local_port?'Local: '+status.local_port:'rgrok'));bar.replaceChildren(connected,element('span','', 'Captured: '+(status.captured_requests||0)))}catch(error){}}
function connectSSE(){const stream=new EventSource(API+'/api/stream');stream.onmessage=event=>{try{const message=JSON.parse(event.data);if(message.event==='new_request'){requests.unshift(message.request);renderList()}else if(message.event==='request_completed'){const request=requests.find(item=>item.id===message.id);if(request){request.duration_ms=message.duration_ms;request.resp_status=message.resp_status;renderList();if(selected===request.id)renderDetail(request)}}}catch(error){}};stream.onerror=()=>setTimeout(connectSSE,3000)}
function renderList(){const filter=(document.getElementById('filter').value||'').toLowerCase();const visible=requests.filter(r=>!filter||(r.req_method+' '+r.req_url+' '+(r.resp_status||'')).toLowerCase().includes(filter));const list=document.getElementById('requestList');list.replaceChildren();if(!visible.length){list.append(element('div','empty-list','No requests captured'));return}visible.forEach(r=>{const item=element('div','request-item'+(selected===r.id?' active':''));item.addEventListener('click',()=>selectReq(r.id));item.append(element('span','method',r.req_method),element('span','req-path',r.req_url),element('span','',r.resp_status||''),element('span','req-duration',r.duration_ms==null?'...':r.duration_ms+'ms'));list.append(item)})}
function selectReq(id){selected=id;const request=requests.find(item=>item.id===id);if(request)renderDetail(request);renderList()}
function appendRow(table,key,value){const row=document.createElement('tr');row.append(element('td','',key),element('td','',value));table.append(row)}
function decodeBody(body){try{return atob(body)}catch(error){return String(body)}}
function renderDetail(request){const pane=document.getElementById('detailPane');pane.replaceChildren();const header=element('div','detail-header');const title=element('span');title.append(element('strong','',request.req_method),document.createTextNode(' '+(request.req_url||'')));const replayButton=element('button','', 'Replay');replayButton.type='button';replayButton.addEventListener('click',()=>replay(request.id));header.append(title,replayButton);const tabs=element('div','tabs');[['headers','Headers'],['reqbody','Request Body'],['response','Response'],['timing','Timing']].forEach(([name,label])=>{const tab=element('div','tab'+(activeTab===name?' active':''),label);tab.addEventListener('click',()=>{activeTab=name;renderDetail(request)});tabs.append(tab)});const content=element('div','tab-content');content.append(tabContent(request));pane.append(header,tabs,content)}
function tabContent(r){if(activeTab==='headers'){const fragment=document.createDocumentFragment();fragment.append(element('h4','','Request Headers'));const table=element('table','headers');(r.req_headers||[]).forEach(([key,value])=>appendRow(table,key,value));fragment.append(table);if(r.resp_headers){fragment.append(element('h4','','Response Headers'));const responseTable=element('table','headers');r.resp_headers.forEach(([key,value])=>appendRow(responseTable,key,value));fragment.append(responseTable)}return fragment}if(activeTab==='reqbody')return r.req_body?element('pre','body',decodeBody(r.req_body)):element('div','empty-list','No request body');if(activeTab==='response'){const fragment=document.createDocumentFragment();const status=element('p','',r.resp_status?'Status: ':'Awaiting response...');if(r.resp_status)status.append(element('strong','',r.resp_status));fragment.append(status);if(r.resp_body)fragment.append(element('pre','body',decodeBody(r.resp_body)));return fragment}const table=element('table','headers');appendRow(table,'Captured at',r.captured_at||'N/A');appendRow(table,'Duration',r.duration_ms==null?'Pending':r.duration_ms+'ms');appendRow(table,'Remote addr',r.remote_addr||'N/A');appendRow(table,'TLS version',r.tls_version||'None');appendRow(table,'Tunnel ID',r.tunnel_id||'N/A');return table}
async function replay(id){try{const response=await mutate(API+'/api/requests/'+encodeURIComponent(id)+'/replay',{method:'POST'});if(response.ok)setTimeout(loadRequests,500)}catch(error){console.error('Replay failed',error)}}
async function clearAll(){await mutate(API+'/api/requests',{method:'DELETE'});requests=[];selected=null;renderList();document.getElementById('detailPane').replaceChildren(element('div','detail-empty','Select a request to inspect'))}
document.getElementById('filter').addEventListener('input',renderList);document.getElementById('clearButton').addEventListener('click',clearAll);loadRequests();loadStatus();connectSSE();setInterval(loadStatus,10000)
</script>
</body>
</html>
