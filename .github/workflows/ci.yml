name: CI

on:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'deploy/Dockerfile'

  check:
    name: Check
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets

  check-skip:
    name: Check
    needs: changes
    if: needs.changes.outputs.rust != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No Rust changes, skipping"

  metadata:
    name: Metadata
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify MSRV and Docker builder stay aligned
        shell: bash
        run: |
          msrv="$(cargo metadata --format-version 1 --no-deps | jq -er '
            [.packages[].rust_version]
            | unique
            | if length == 1 and .[0] != null
              then .[0]
              else error("all workspace packages must share one rust-version")
              end
          ')"
          grep -Fx "FROM rust:${msrv}-bookworm AS builder" deploy/Dockerfile

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all

  test-skip:
    name: Test
    needs: changes
    if: needs.changes.outputs.rust != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No Rust changes, skipping"

  clippy:
    name: Clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  clippy-skip:
    name: Clippy
    needs: changes
    if: needs.changes.outputs.rust != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No Rust changes, skipping"

  fmt:
    name: Formatting
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  fmt-skip:
    name: Formatting
    needs: changes
    if: needs.changes.outputs.rust != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No Rust changes, skipping"

  license:
    name: License metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify AGPL metadata and package contents
        shell: bash
        run: |
          set -euo pipefail
          test -s LICENSE
          grep -q '^[[:space:]]*GNU AFFERO GENERAL PUBLIC LICENSE[[:space:]]*$' LICENSE
          grep -q '^[[:space:]]*Version 3, 19 November 2007[[:space:]]*$' LICENSE
          test "$(cargo metadata --no-deps --format-version 1 | jq -r '[.packages[].license] | unique | join("\n")')" = "AGPL-3.0-only"
          for package in rgrok-proto rgrok-server rgrok-client; do
            cargo package --package "$package" --allow-dirty --no-verify --list | grep -qx 'LICENSE'
          done

  pr-title:
    name: PR Title
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            chore
            ci
            test
            build
          requireScope: false
          subjectPattern: ^.+$
          subjectPatternError: |
            PR title must follow conventional commits format (e.g. "feat: add feature").
